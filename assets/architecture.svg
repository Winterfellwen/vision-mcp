<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="box1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="320" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">System Architecture</text>

  <!-- Client box -->
  <rect x="60" y="75" width="160" height="60" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="140" y="100" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MCP Client</text>
  <text x="140" y="118" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11">OpenCode / Claude / Cursor</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="105" x2="290" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="98" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">stdio MCP</text>

  <!-- Vision MCP box -->
  <rect x="290" y="75" width="180" height="60" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="380" y="100" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Vision MCP Server</text>
  <text x="380" y="118" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11">index.js</text>

  <!-- Arrow 2 -->
  <line x1="470" y1="105" x2="540" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="98" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">OpenAI SDK</text>

  <!-- API box -->
  <rect x="540" y="75" width="200" height="60" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Vision API</text>
  <text x="640" y="118" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11">OpenAI / OpenRouter / etc.</text>

  <!-- Subtitle row -->
  <text x="140" y="200" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Sends MCP tool calls</text>
  <text x="380" y="200" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Compresses image + calls API</text>
  <text x="640" y="200" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Returns analysis text</text>

  <!-- Flow arrows 2 -->
  <line x1="640" y1="135" x2="640" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <line x1="380" y1="135" x2="380" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <line x1="140" y1="135" x2="140" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Bottom features -->
  <rect x="60" y="225" width="680" height="70" rx="8" fill="#e2e8f0"/>
  <text x="75" y="248" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Built-in Features</text>
  <text x="75" y="268" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Image Compression (Jimp)  ·  Rate Limiting  ·  Retry with Backoff  ·  Request Queue  ·  SOCKS5 Proxy</text>
  <text x="75" y="283" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">analyze_image  ·  compare_images  ·  extract_text</text>
</svg>
