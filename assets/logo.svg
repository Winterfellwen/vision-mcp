<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pupil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>

  <!-- Outer eye shape -->
  <path d="M100 200 Q200 110 300 200 Q200 290 100 200Z" fill="url(#eye)" stroke="#475569" stroke-width="4"/>

  <!-- Inner eye circle -->
  <circle cx="200" cy="200" r="60" fill="url(#pupil)"/>

  <!-- Pupil -->
  <circle cx="200" cy="200" r="25" fill="#0f172a"/>
  <circle cx="212" cy="190" r="8" fill="rgba(255,255,255,0.7)"/>

  <!-- Neural network nodes and connections -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none">
    <line x1="50" y1="60" x2="100" y2="100"/>
    <line x1="50" y1="60" x2="120" y2="50"/>
    <line x1="100" y1="100" x2="120" y2="50"/>
    <line x1="300" y1="100" x2="350" y2="60"/>
    <line x1="300" y1="100" x2="280" y2="50"/>
    <line x1="350" y1="60" x2="280" y2="50"/>
    <line x1="50" y1="340" x2="100" y2="300"/>
    <line x1="50" y1="340" x2="120" y2="350"/>
    <line x1="100" y1="300" x2="120" y2="350"/>
    <line x1="300" y1="300" x2="350" y2="340"/>
    <line x1="300" y1="300" x2="280" y2="350"/>
    <line x1="350" y1="340" x2="280" y2="350"/>
  </g>

  <!-- Neural nodes -->
  <g fill="rgba(255,255,255,0.5)">
    <circle cx="50" cy="60" r="6"/>
    <circle cx="100" cy="100" r="6"/>
    <circle cx="120" cy="50" r="6"/>
    <circle cx="300" cy="100" r="6"/>
    <circle cx="350" cy="60" r="6"/>
    <circle cx="280" cy="50" r="6"/>
    <circle cx="50" cy="340" r="6"/>
    <circle cx="100" cy="300" r="6"/>
    <circle cx="120" cy="350" r="6"/>
    <circle cx="300" cy="300" r="6"/>
    <circle cx="350" cy="340" r="6"/>
    <circle cx="280" cy="350" r="6"/>
  </g>

  <!-- Name text -->
  <text x="200" y="380" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1" opacity="0.8">VISION MCP</text>
</svg>
